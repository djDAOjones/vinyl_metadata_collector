[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "windsurf-cli"
version = "0.1.0"
description = "CLI tool for enriching vinyl CSVs with Discogs data"
readme = "README.md"
authors = [{ name = "Joe" }]
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "httpx>=0.27,<0.28",
  "click>=8.1,<8.2",
  "typer>=0.12,<0.13",
  "rich>=13.7,<14"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9"
]

[project.scripts]
windsurf-discogs = "windsurf_cli.cli:main"
